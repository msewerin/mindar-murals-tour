<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>A-Frame + MindAR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
    body { margin: 0; overflow: hidden; }
    </style>
</head>

<body>
    <a-scene
        mindar-image="imageTargetSrc: ./compiled/targets_murals.mind;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: true"
    >

        <!-- Kamera -->
        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
        >
        </a-camera>

        <!-- Marker -->
        <a-entity mindar-image-target="targetIndex: 0">

            <!-- Testobjekt  -->
            <a-box 
                position="0 0 0" 
                depth="0.5" 
                height="0.5" 
                width="0.5"
                color="red"
            >
            </a-box>

            <!-- GLTF/GLB-Modell
            <a-gltf-model
                src="./models/deer.glb"
                position="0 -0.8 0"
                scale="0.25 0.25 0.25"
                rotation="0 45 0"
                animation-mixer
            >
            </a-gltf-model> -->

        </a-entity>

        <!-- Marker -->
        <a-entity mindar-image-target="targetIndex: 1">

            <!-- Testobjekt -->
            <a-box 
                position="0 0 0" 
                depth="0.5" 
                height="0.5" 
                width="0.5"
                color="red"
            >
            </a-box>

            <!-- GLTF/GLB-Modell
            <a-gltf-model
                src="./models/giraffe.glb"
                position="0 -0.8 0"
                scale="0.25 0.25 0.25"
                rotation="0 0 0"
                animation-mixer
            >
            </a-gltf-model> -->

        </a-entity>

    </a-scene>
</body>
</html>
